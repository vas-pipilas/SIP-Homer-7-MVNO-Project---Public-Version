name: Public portfolio safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/public_safety_scan.py

      - name: Publication safety scan
        run: python3 tools/public_safety_scan.py
